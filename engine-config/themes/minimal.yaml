name: "minimal"
mode: "minimal"
colors:
  primary: "#000000"
  secondary: "#666666"
  background: "#FFFFFF"
  surface: "#F9F9F9"
  border: "#EEEEEE"
  text: "#111111"
  muted: "#888888"
  success: "#00CC00"
  warning: "#FFCC00"
  info: "#0099FF"
  accent: "#FF0055"
typography:
  font_family: "sans-serif"
  heading: 24
  body: 14
  small: 12
spacing:
  xs: 4
  sm: 8
  md: 16
  lg: 24
  xl: 32
radius:
  card: 4
  progress: 2
  badge: 2
shadows:
  none: "none"
  low: "0 1px 2px rgba(0,0,0,0.05)"
  medium: "0 4px 6px rgba(0,0,0,0.1)"
  high: "0 10px 15px rgba(0,0,0,0.15)"
motion:
  duration_fast: 100
  duration_normal: 200
  duration_slow: 300
  easing: "ease-in-out"
